appId: com.ballchen.tally
name: Phase 7 — offline banner, cached reads, blocked write, resync
# The Simulator cannot be taken off the network from the host, so this drives
# the __DEV__ "Simulate offline" override on the profile screen, which flips
# TanStack Query's onlineManager exactly as NetInfo would.
# Requires the fixtures from apps/mobile/scripts/seed-dev.ts.
env:
  EMAIL: phase2-test@example.com
  PASSWORD: Phase2Test!2026
---
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: 'Welcome to Tally'
    timeout: 20000
- tapOn:
    id: 'login-email'
- eraseText
- inputText: ${EMAIL}
- tapOn:
    id: 'login-password'
- eraseText
- inputText: ${PASSWORD}
- tapOn: 'Done'
- tapOn:
    id: 'login-submit'
- tapOn:
    text: 'Not Now'
    optional: true
- tapOn:
    id: 'push-prompt-later'
    optional: true

# Warm the cache for both the list and one group's detail.
- extendedWaitUntil:
    visible: '.*Japan Trip.*'
    timeout: 30000
- tapOn: '.*Japan Trip.*'
- extendedWaitUntil:
    visible:
      id: 'add-expense-fab'
    timeout: 30000
- tapOn:
    id: 'group-back'

- extendedWaitUntil:
    visible: '.*Japan Trip.*'
    timeout: 30000
- tapOn:
    id: 'open-profile'
- scroll
- tapOn:
    id: 'profile-simulate-offline'
- tapOn: 'Tally'

# G4 — the banner appears and the cached list still renders.
- extendedWaitUntil:
    visible:
      id: 'offline-banner'
    timeout: 20000
- assertVisible: '.*Japan Trip.*'
- takeScreenshot: docs/screens/offline-groups-list

# G4 — a cached group detail is still readable offline.
- tapOn: '.*Japan Trip.*'
- extendedWaitUntil:
    visible:
      id: 'add-expense-fab'
    timeout: 30000
- assertVisible:
    id: 'offline-banner'
- takeScreenshot: docs/screens/offline-group-detail

# G4 — a write is refused with an explanation instead of hanging or crashing.
- tapOn:
    id: 'add-expense-fab'
- extendedWaitUntil:
    visible:
      id: 'calculator-display'
    timeout: 20000
- tapOn:
    id: 'calc-key-1'
- tapOn:
    id: 'calc-key-0'
- tapOn:
    id: 'calc-key-0'
- tapOn:
    id: 'calculator-confirm'
- extendedWaitUntil:
    visible:
      id: 'expense-description'
    timeout: 20000
- inputText: 'Offline probe'
- tapOn: 'Done'
- tapOn:
    id: 'expense-save'
- extendedWaitUntil:
    visible: ".*You're offline.*"
    timeout: 20000
- takeScreenshot: docs/screens/offline-write-blocked
- tapOn:
    id: 'expense-cancel'

# Back online: the banner clears and the timeline refetches.
- tapOn:
    id: 'group-back'
- tapOn:
    id: 'open-profile'
- scroll
- tapOn:
    id: 'profile-simulate-offline'
- extendedWaitUntil:
    notVisible:
      id: 'offline-banner'
    timeout: 20000
- tapOn: 'Tally'
- extendedWaitUntil:
    visible: '.*Japan Trip.*You are owed NT\$ 300.*'
    timeout: 30000
- takeScreenshot: docs/screens/offline-recovered
