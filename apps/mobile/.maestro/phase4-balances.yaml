appId: com.ballchen.tally
name: Phase 4 — amount formatting and settle-button visibility
# Requires the fixtures from apps/mobile/scripts/seed-dev.ts (group `phase4kt`).
# Kyoto Trip nets out to C owes B NT$ 12,608 and A owes B NT$ 11,688.
env:
  EMAIL: phase2-test@example.com
  PASSWORD: Phase2Test!2026
  USER_A: 237af5ca-f35f-46c6-8f48-6647ddd77f72
  USER_B: cdd03085-4c5d-4399-8b17-665ba4d50f9c
  USER_C: 1a794b7a-83e7-4c76-a770-fcf32dd26e43
---
- clearKeychain
- launchApp:
    clearState: true
- assertVisible: 'Welcome to Tally'
- tapOn:
    id: 'login-email'
- eraseText
- inputText: ${EMAIL}
- tapOn:
    id: 'login-password'
- eraseText
- inputText: ${PASSWORD}
- tapOn: 'Done'
- tapOn:
    id: 'login-submit'
# iOS offers to store the password in the keychain. The dialog can land a
# beat after the app has already navigated on, so an unguarded optional tap
# races it and leaves it covering the screen; wait for it before dismissing.
- extendedWaitUntil:
    visible: '.*Save Password.*'
    timeout: 10000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true

# The list has no deterministic order, so the card can be below the fold.
- scrollUntilVisible:
    element:
      text: '.*Kyoto Trip.*'
    direction: DOWN
    timeout: 30000
- tapOn: '.*Kyoto Trip.*'

# D1 — your balance and the debt pairings use formatAmount (TWD has no decimals).
- extendedWaitUntil:
    visible: 'You owe NT\$ 11,688'
    timeout: 20000
- assertVisible: 'NT\$ 12,608'
- assertVisible: 'NT\$ 11,688'

# D2 — only a party to the pairing gets a Settle button.
- assertVisible:
    id: 'settle-${USER_A}-${USER_B}'
- assertNotVisible:
    id: 'settle-${USER_C}-${USER_B}'
- takeScreenshot: d1-d2-balances-and-settle-visibility

# D1 — timeline cards: JPY has no decimals, USD has two, both are grouped.
# A card is a single accessibility element, so its amount is matched inside it.
- scrollUntilVisible:
    element:
      text: '.*¥ 12,000.*'
    direction: DOWN
    timeout: 20000
- assertVisible: '.*Hotel booking.*\$ 1,234.50.*'
- assertVisible: '.*Airport bus.*NT\$ 600.*'
- takeScreenshot: d1-timeline-amounts
