appId: com.ballchen.tally
name: Phase 2 — invite deep link is replayed after sign-in
env:
  EMAIL: phase2-test@example.com
  PASSWORD: Phase2Test!2026
---
- clearKeychain
- launchApp:
    clearState: true
- openLink: 'tally://join/abc123'
# Safari asks for confirmation before handing a custom scheme to the app.
- tapOn:
    text: 'Open'
    optional: true
- tapOn:
    text: 'Open'
    optional: true
- assertVisible: 'Welcome to Tally'

- tapOn:
    id: 'login-email'
- eraseText
- inputText: ${EMAIL}
- tapOn:
    id: 'login-password'
- eraseText
- inputText: ${PASSWORD}
- tapOn: "Done"
- tapOn:
    id: 'login-submit'
# iOS offers to store the password in the keychain; dismiss it so the app is visible again.
- tapOn:
    text: 'Not Now'
    optional: true
- assertVisible: 'Join Group'
- assertVisible: '.*abc123.*'
- takeScreenshot: b6-join

# Already signed in: the same link goes straight to the join screen.
- openLink: 'tally://join/xyz789'
- tapOn:
    text: 'Open'
    optional: true
- tapOn:
    text: 'Open'
    optional: true
- assertVisible: 'Join Group'
- assertVisible: '.*xyz789.*'
