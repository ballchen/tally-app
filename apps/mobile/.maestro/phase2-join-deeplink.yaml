appId: com.ballchen.tally
name: Phase 2 — invite deep link is replayed after sign-in
# Requires the fixtures from apps/mobile/scripts/seed-dev.ts: phase3in is a group
# the signed-in account is not a member of, so the join screen stays on screen.
env:
  EMAIL: phase2-test@example.com
  PASSWORD: Phase2Test!2026
---
- clearKeychain
- launchApp:
    clearState: true
- openLink: 'tally://join/phase3in'
# Safari asks for confirmation before handing a custom scheme to the app.
- tapOn:
    text: 'Open'
    optional: true
- tapOn:
    text: 'Open'
    optional: true
- assertVisible: 'Welcome to Tally'

- tapOn:
    id: 'login-email'
- eraseText
- inputText: ${EMAIL}
- tapOn:
    id: 'login-password'
- eraseText
- inputText: ${PASSWORD}
- tapOn: "Done"
- tapOn:
    id: 'login-submit'
# iOS offers to store the password in the keychain. The dialog can land a
# beat after the app has already navigated on, so an unguarded optional tap
# races it and leaves it covering the screen; wait for it before dismissing.
- extendedWaitUntil:
    visible: '.*Save Password.*'
    timeout: 10000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- extendedWaitUntil:
    visible: 'Join Group'
    timeout: 20000
- assertVisible: 'Invite Only'
- takeScreenshot: b6-join

# Already signed in: the same kind of link goes straight to the join screen.
- openLink: 'tally://join/unknowncode'
- tapOn:
    text: 'Open'
    optional: true
- tapOn:
    text: 'Open'
    optional: true
- extendedWaitUntil:
    visible: 'Oops!'
    timeout: 20000
- assertVisible: 'Group not found or invalid link.'
