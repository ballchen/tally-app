appId: com.ballchen.tally
name: Phase 2 — reset-password deep link with an invalid code
---
- clearKeychain
- launchApp:
    clearState: true
- openLink: 'tally://reset-password?code=fake'
# Safari asks for confirmation before handing a custom scheme to the app.
- tapOn:
    text: 'Open'
    optional: true
- tapOn:
    text: 'Open'
    optional: true
- assertVisible: 'Reset Password'
# Either wording is correct: 'expired' when the fake code is rejected by Supabase,
# 'invalid' when the link carried no usable credentials at all.
- assertVisible: '.*Invalid.*reset link.*'
- takeScreenshot: b5-reset-invalid
