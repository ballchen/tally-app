appId: com.ballchen.tally
name: Phase 2 — email login (wrong password then valid credentials)
env:
  EMAIL: phase2-test@example.com
  PASSWORD: Phase2Test!2026
---
- clearKeychain
- launchApp:
    clearState: true
- assertVisible: 'Welcome to Tally'

- tapOn:
    id: 'login-email'
- eraseText
- inputText: ${EMAIL}
- tapOn:
    id: 'login-password'
- eraseText
- inputText: 'definitely-wrong-password'
- tapOn: "Done"
- tapOn:
    id: 'login-submit'
- assertVisible: 'Invalid login credentials'
- takeScreenshot: b3-error

- tapOn:
    id: 'login-password'
- eraseText
- inputText: ${PASSWORD}
- tapOn: "Done"
- tapOn:
    id: 'login-submit'
# iOS offers to store the password in the keychain. The dialog can land a
# beat after the app has already navigated on, so an unguarded optional tap
# races it and leaves it covering the screen; wait for it before dismissing.
- extendedWaitUntil:
    visible: '.*Save Password.*'
    timeout: 10000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- assertVisible: 'Tally'
- takeScreenshot: b3-signed-in
