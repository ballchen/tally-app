appId: com.ballchen.tally
name: Phase 6 — display name change reaches the home avatar, then is restored
# Renames and renames back, so it is re-runnable and leaves the fixture as it was
# even if an earlier run died half way.
env:
  EMAIL: phase2-test@example.com
  PASSWORD: Phase2Test!2026
  NAME: Phase Three A
  RENAMED: Zed Tester
---
- clearKeychain
- launchApp:
    clearState: true
- assertVisible: 'Welcome to Tally'
- tapOn:
    id: 'login-email'
- eraseText
- inputText: ${EMAIL}
- tapOn:
    id: 'login-password'
- eraseText
- inputText: ${PASSWORD}
- tapOn: 'Done'
- tapOn:
    id: 'login-submit'
# iOS offers to store the password in the keychain. The dialog can land a
# beat after the app has already navigated on, so an unguarded optional tap
# races it and leaves it covering the screen; wait for it before dismissing.
- extendedWaitUntil:
    visible: '.*Save Password.*'
    timeout: 10000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true
- assertVisible:
    id: 'groups-list'
- tapOn:
    id: 'push-prompt-later'
    optional: true

- tapOn:
    id: 'open-profile'
- assertVisible: 'Settings'
- tapOn:
    id: 'profile-name'
- eraseText
- inputText: ${RENAMED}
- tapOn: 'Done'
- tapOn:
    id: 'profile-save-name'
- takeScreenshot: f-name-saved
# The toast sits over the navigation bar, so let it clear before tapping back.
- extendedWaitUntil:
    notVisible: 'Name updated'
    timeout: 15000
# iOS labels the back button with the previous screen's title.
- tapOn: 'Tally'
- extendedWaitUntil:
    visible:
      id: 'open-profile'
      text: ".*${RENAMED}.*"
    timeout: 20000
- takeScreenshot: f-name-on-home

- tapOn:
    id: 'open-profile'
- tapOn:
    id: 'profile-name'
- eraseText
- inputText: ${NAME}
- tapOn: 'Done'
- tapOn:
    id: 'profile-save-name'
- extendedWaitUntil:
    notVisible: 'Name updated'
    timeout: 15000
- tapOn: 'Tally'
- extendedWaitUntil:
    visible:
      id: 'open-profile'
      text: ".*${NAME}.*"
    timeout: 20000
