appId: com.ballchen.tally
name: Phase 4 — month sections and timeline paging
# Uses the 60-expense fixture `phase4pg`, which spans seven months.
env:
  EMAIL: phase2-test@example.com
  PASSWORD: Phase2Test!2026
---
- clearKeychain
- launchApp:
    clearState: true
- assertVisible: 'Welcome to Tally'
- tapOn:
    id: 'login-email'
- eraseText
- inputText: ${EMAIL}
- tapOn:
    id: 'login-password'
- eraseText
- inputText: ${PASSWORD}
- tapOn: 'Done'
- tapOn:
    id: 'login-submit'
- tapOn:
    text: 'Not Now'
    optional: true

- extendedWaitUntil:
    visible: 'Tally'
    timeout: 20000
- scrollUntilVisible:
    element:
      text: '.*Sixty Expenses.*'
    direction: DOWN
    timeout: 30000
- tapOn: '.*Sixty Expenses.*'

# The newest month heads the timeline and the newest expense sits under it.
- extendedWaitUntil:
    visible: '.*Expense 01.*'
    timeout: 20000
- assertVisible:
    id: 'timeline-month-2026-09'
- takeScreenshot: d7-first-screen

# Only 30 items render up front; reaching the end loads the rest.
- scrollUntilVisible:
    element:
      text: '.*Expense 60.*'
    direction: DOWN
    timeout: 90000
    speed: 60
- assertVisible:
    id: 'timeline-month-2026-03'
- takeScreenshot: d7-bottom-after-paging
