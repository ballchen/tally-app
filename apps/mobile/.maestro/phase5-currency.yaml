appId: com.ballchen.tally
name: Phase 5 — a foreign currency shows the converted amount and today's rate
# Read-only: cancels out of the modal, so `phase5ex` is left untouched.
env:
  EMAIL: phase2-test@example.com
  PASSWORD: Phase2Test!2026
---
- clearKeychain
- launchApp:
    clearState: true
- assertVisible: 'Welcome to Tally'
- tapOn:
    id: 'login-email'
- eraseText
- inputText: ${EMAIL}
- tapOn:
    id: 'login-password'
- eraseText
- inputText: ${PASSWORD}
- tapOn: 'Done'
- tapOn:
    id: 'login-submit'
# iOS offers to store the password in the keychain. The dialog can land a
# beat after the app has already navigated on, so an unguarded optional tap
# races it and leaves it covering the screen; wait for it before dismissing.
- extendedWaitUntil:
    visible: '.*Save Password.*'
    timeout: 10000
    optional: true
- tapOn:
    text: 'Not Now'
    optional: true

- extendedWaitUntil:
    visible:
      id: 'groups-list'
    timeout: 20000
- scrollUntilVisible:
    element:
      text: '.*Expense Lab.*'
    direction: DOWN
    timeout: 30000
- tapOn: '.*Expense Lab.*'
- extendedWaitUntil:
    visible:
      id: 'add-expense-fab'
    timeout: 20000
- tapOn:
    id: 'add-expense-fab'

- extendedWaitUntil:
    visible:
      id: 'calculator-display'
    timeout: 20000
- tapOn:
    id: 'calc-key-1'
- tapOn:
    id: 'calc-key-0'
- tapOn:
    id: 'calc-key-0'
- tapOn:
    id: 'calc-key-0'
- tapOn:
    id: 'calc-key-0'

# E2 — switching to JPY shows the base-currency conversion and the rate used.
- assertNotVisible:
    id: 'calculator-converted'
- tapOn:
    id: 'calculator-currency'
- tapOn: 'JPY'
- extendedWaitUntil:
    visible:
      id: 'calculator-converted'
    timeout: 20000
- assertVisible: '.*≈ NT\$.*1 JPY = 0\.\d+ TWD.*'
- takeScreenshot: e2-jpy-conversion-and-rate

- tapOn:
    id: 'expense-cancel'
