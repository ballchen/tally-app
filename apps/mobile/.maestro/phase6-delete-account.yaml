appId: com.ballchen.tally
name: Phase 6 — delete account (throwaway fixture) with double confirmation
# Bracket with the fixture script, which also asserts the rows are gone:
#   node --experimental-strip-types apps/mobile/scripts/temp-account.ts create
#   maestro test apps/mobile/.maestro/phase6-delete-account.yaml
#   node --experimental-strip-types apps/mobile/scripts/temp-account.ts check
env:
  EMAIL: phase6-temp@example.com
  PASSWORD: Phase6Temp!2026
---
- clearKeychain
- launchApp:
    clearState: true
- assertVisible: 'Welcome to Tally'
- tapOn:
    id: 'login-email'
- eraseText
- inputText: ${EMAIL}
- tapOn:
    id: 'login-password'
- eraseText
- inputText: ${PASSWORD}
- tapOn: 'Done'
- tapOn:
    id: 'login-submit'
- tapOn:
    text: 'Not Now'
    optional: true
- assertVisible: 'Tally'
- tapOn:
    id: 'push-prompt-later'
    optional: true
- extendedWaitUntil:
    visible: '.*Temp Delete Group.*'
    timeout: 20000

- tapOn:
    id: 'open-profile'
- scroll
- tapOn:
    id: 'profile-delete'
- assertVisible: 'Delete your account?'
- takeScreenshot: f6-confirm-1
- tapOn: 'Continue'
- assertVisible: 'Type DELETE to permanently delete your account.'
- takeScreenshot: f6-confirm-2

# The wrong word must not delete anything.
- inputText: 'delete me'
- tapOn: 'Delete forever'
- assertNotVisible: 'Confirm deletion'
- assertVisible: 'Settings'

- scroll
- tapOn:
    id: 'profile-delete'
- tapOn: 'Continue'
- inputText: 'DELETE'
- tapOn: 'Delete forever'
- extendedWaitUntil:
    visible: 'Welcome to Tally'
    timeout: 30000
- takeScreenshot: f6-deleted
